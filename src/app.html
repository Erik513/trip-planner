<title>Reiseplaner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: eine schmale Spalte – oben To-dos, darunter Packtabelle nach Kategorien, Fortschritt als Gepäckanhänger */
:root{
  --bg:#eef2f3; --surface:#ffffff; --fg:#17262b; --muted:#5d7178; --line:#d3dde0;
  --accent:#0f7c74; --accent-soft:#d6ece9; --done:#8a9ca1;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a1d; --surface:#18252a; --fg:#e4eef0; --muted:#93a7ad; --line:#2a3b41;
  --accent:#4fc2b6; --accent-soft:#1d3a39; --done:#62777d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a1d; --surface:#18252a; --fg:#e4eef0; --muted:#93a7ad; --line:#2a3b41;
  --accent:#4fc2b6; --accent-soft:#1d3a39; --done:#62777d; color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:32px 56px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.tag{font-family:var(--mono);font-size:.8rem;border:1.5px dashed var(--accent);color:var(--accent);
  border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;min-width:150px;font-variant-numeric:tabular-nums}
.tag b{font-size:1.25rem;color:var(--fg)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.sync{font-size:.72rem;color:var(--muted);min-height:1em}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

h2{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0 0 4px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.count{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.todos{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.todos li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.todos li:first-child{border-top:0}
label.chk{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;margin:0;cursor:pointer;display:inline-grid;place-content:center;border:1.5px solid color-mix(in srgb, var(--muted) 55%, var(--line));border-radius:6px;background:var(--surface);transition:background .15s, border-color .15s}
input[type=checkbox]::after{content:"";width:9px;height:5px;border:2px solid var(--surface);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg);opacity:0}
input[type=checkbox]:hover{border-color:var(--accent)}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{opacity:1}
@media (prefers-reduced-motion:reduce){input[type=checkbox]{transition:none}}
.is-done .txt{color:var(--done);text-decoration:line-through}
.edit{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid transparent;border-radius:0;padding:2px 0;width:100%;min-width:0}
.edit:hover{border-bottom-color:var(--line)}
.edit:focus{outline:none;border-bottom-color:var(--accent);background:var(--accent-soft);text-decoration:none;color:var(--fg)}
td.q .edit{font-family:var(--mono);color:var(--muted);width:6ch}
.todos .edit{flex:1}
.handle{border:0;background:none;color:var(--muted);cursor:grab;padding:4px 2px;font-size:1.05rem;line-height:1;touch-action:none;border-radius:6px;letter-spacing:-.15em}
.handle:hover{color:var(--fg)}
.todos li.dragging{background:var(--accent-soft);box-shadow:0 4px 14px rgba(0,0,0,.15);position:relative;z-index:2}
.todos.is-dragging, .todos.is-dragging *{cursor:grabbing;user-select:none}
.del{border:0;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:2px 6px;border-radius:6px}
.del:hover,.del:focus-visible{color:var(--fg);background:var(--accent-soft)}

.add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.add input,.add select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.add input[type=text]{flex:1 1 180px}
.add input[type=text].qty{flex:0 0 4.5em;width:4.5em}
.add button,.reset{font:inherit;font-weight:600;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--surface);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.table-box{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:420px;table-layout:fixed}
col.cc{width:72px}
col.cq{width:7em}
col.cx{width:44px}
th,td{text-align:left;padding:9px 14px;border-top:1px solid var(--line);vertical-align:middle}
thead th{border-top:0;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
tr.cat th{background:var(--accent-soft);color:var(--fg);font-family:var(--display);font-weight:600;font-size:1rem;letter-spacing:0;text-transform:none}
tr.cat .cat-row{display:flex;align-items:center;gap:10px}
tr.cat .cat-row .edit{font-family:var(--display);font-weight:600;font-size:1rem;flex:1}
tr.cat .count{font-family:var(--mono);font-weight:500;white-space:nowrap}
.ghost{font:inherit;font-weight:600;border:1px solid var(--line);color:var(--muted);background:transparent;border-radius:8px;padding:8px 14px;cursor:pointer}
.ghost:hover{color:var(--fg);background:var(--accent-soft)}
.ghost[data-armed="1"]{color:#fff;background:#b8443a;border-color:#b8443a}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:flex-end}
.info-grid{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.grp{padding-block:12px}
.grp:first-child{padding-top:2px}
.grp:last-child{padding-bottom:2px}
.grp + .grp{border-top:1px solid var(--line)}
[data-col].is-collapsed > :not(.sec-head):not(.grp-head){display:none!important}
[data-col].is-collapsed > .sec-head .sec-btns, [data-col].is-collapsed > .grp-head .sec-btns{display:none}
.grp-head .toggle{color:inherit}
.trip-date{max-width:220px;margin-bottom:10px}
.leg.meet .leg-no{background:var(--muted)}
.leg.current{background:var(--accent-soft);border-color:var(--accent)}
.leg.current .leg-no{background:var(--accent)}
.leg.is-done{opacity:.55}
.leg.is-done .leg-no{background:var(--done)}
.leg-side{align-self:stretch;display:grid;grid-template-rows:1fr auto 1fr;justify-items:center;flex:none}
.leg-side .del{grid-row:2}
.leg-side .leg-chk{grid-row:3;align-self:end;margin:0 0 10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.leg-handle{border:0;padding:0;cursor:grab;touch-action:none}
.leg-handle:hover{filter:brightness(1.1)}
.legs .leg.dragging{box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative;z-index:3}
.legs.is-dragging, .legs.is-dragging *{cursor:grabbing;user-select:none}
#fromHin[data-armed="1"]{color:#fff;background:#b8443a;border-color:#b8443a}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));z-index:50;display:flex;align-items:center;gap:14px;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px 10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-size:.92rem}
.toast button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--accent-soft);cursor:pointer;padding:4px 6px;border-radius:6px;text-decoration:underline;text-underline-offset:3px}
.share{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.share-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.share-head strong{font-family:var(--display);font-weight:600}
.share-hint{margin:0;color:var(--muted);font-size:.88rem}
.share-code{font-family:var(--mono);font-size:.78rem;line-height:1.4;resize:vertical;word-break:break-all}
.share-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
.share-msg{margin-right:auto;font-size:.85rem;color:var(--muted)}
.share-msg.err{color:#b8443a}
#importApply[data-armed="1"]{background:#b8443a}
.dbox{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.dbox::after{content:"\25BE";color:var(--muted);font-size:.8em}
.dbox.is-empty .dtext{color:var(--muted)}
.dbox .dtext{overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:0;font-size:inherit;color:inherit;font-weight:inherit}
.dbox input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.dbox input[type=date]::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;margin:0;padding:0;cursor:pointer;opacity:0}
.dbox:focus-within{border-color:var(--accent)}
.dbox:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pair .dbox{flex:1.5 1 0}
.langsw{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.langsw button{font:inherit;font-size:.72rem;font-weight:600;line-height:1;border:0;background:transparent;color:var(--muted);padding:6px 8px;cursor:pointer;transition:background .15s, color .15s}
.langsw button + button{border-left:1px solid var(--line)}
.langsw button:hover{color:var(--fg);background:var(--accent-soft)}
.langsw button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.icon-btn{display:inline-grid;place-items:center;padding:6px!important;line-height:0}
.icon-btn.ok{color:var(--accent);border-color:var(--accent)}
.head-right{display:flex;align-items:stretch;gap:8px}
.head-right .icon-btn{align-self:flex-start;padding:5px 7px!important;border-radius:6px}
.head-right .icon-btn svg{width:14px;height:14px}
@media (max-width:600px){.head-right{width:100%;flex-wrap:wrap;justify-content:flex-end}.head-right .tag{flex:1 1 100%;order:1}}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.maps{display:inline-flex;gap:10px;align-items:baseline}
.maps a{color:var(--accent);text-decoration:none;font-weight:700;text-transform:none;letter-spacing:0;font-size:.8rem}
.maps a:hover{text-decoration:underline}
.maps a::after{content:" ↗";font-size:.85em}
.leg.meet .c-from .lbl-row > span:first-child{color:var(--accent);font-size:.8rem;font-weight:700}
.grp-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.grp-head h3{margin:0!important}
.note-col > .grp-head{margin:0}
.note-col .toggle{gap:4px}
[data-col="hin"] > .grp-head, [data-col="rueck"] > .grp-head{flex-direction:column;align-items:flex-start;gap:4px}
[data-col="hin"] > .grp-head .count:empty, [data-col="rueck"] > .grp-head .count:empty{display:none}
.legs{display:flex;flex-direction:column;gap:8px}
.leg{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.leg-no{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--surface);font-family:var(--mono);font-size:.78rem;display:grid;place-items:center}
.leg-grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}
.leg-grid .c-from{grid-row:1;grid-column:1 / -1}
.leg-grid .c-to{grid-row:2;grid-column:1 / -1}
.arr{display:flex;align-items:center;gap:8px;min-height:38px;padding:0 10px;border-radius:8px;border:1px dashed var(--line);color:var(--muted);font-size:.9rem}
.arr b{font-family:var(--mono);font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.dur-box{display:flex;align-items:center;gap:4px;padding-block:0;padding-right:4px}
.dur-box input{flex:1;min-width:0;height:100%;font:inherit;line-height:normal;color:var(--fg);background:transparent;border:0;padding:0;font-variant-numeric:tabular-nums}
.leg .fld{box-sizing:border-box;height:40px}
.leg .arr{box-sizing:border-box;height:40px;min-height:0}
.dur-box input:focus{outline:none}
.dur-box:focus-within{border-color:var(--accent)}
.unit-lbl{flex:none;font-size:.72rem;color:var(--muted);white-space:nowrap}
.unit{flex:none;font:inherit;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;padding:2px 7px;cursor:pointer}
.unit:hover{color:var(--fg);background:var(--accent-soft)}
@media (max-width:600px){
  .leg-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .unit-lbl{display:none}
  .leg.meet .leg-grid > :nth-child(2){grid-column:1 / -1}

}
.leg .fld{background:var(--surface)}
.leg .del{align-self:center}
.legs .empty{padding:4px 2px}
.grp h3{font-family:var(--display);font-size:.95rem;font-weight:600;margin:0 0 8px;color:var(--accent)}
.sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:10px 16px}
.pair{display:flex;gap:6px;min-width:0}
.pair .fld[type=date]{flex:1.5 1 0}
.tpick{position:relative;flex:1 1 0;min-width:0}
.tbtn{text-align:left;cursor:pointer;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tbtn.is-empty{color:var(--muted)}
.tbtn::after{content:"▾";color:var(--muted);font-size:.8em}
.tbtn[aria-expanded="true"]{border-color:var(--accent)}
.tpop{position:absolute;z-index:20;top:calc(100% + 4px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;gap:6px}
.tcols{display:flex;gap:4px}
.tcol{position:relative;max-height:210px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:2px;padding:2px 4px 2px 2px;scrollbar-width:thin}
.tcol + .tcol{border-left:1px solid var(--line);padding-left:6px}
.tcol-head{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:2px 10px}
.opt{font:inherit;font-variant-numeric:tabular-nums;border:0;background:none;padding:6px 14px;border-radius:6px;color:var(--fg);cursor:pointer;flex:none}
.opt:hover{background:var(--accent-soft)}
.opt[aria-selected="true"]{background:var(--accent);color:var(--surface)}
.tfoot{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--line);padding-top:6px}
.tdone{font:inherit;font-size:.8rem;font-weight:600;border:0;border-radius:6px;padding:3px 12px;background:var(--accent);color:var(--surface);cursor:pointer}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.fld{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%;box-sizing:border-box}
textarea.fld{resize:vertical;min-height:4.5em;line-height:1.45}
.fld:focus{outline:none;border-color:var(--accent)}
.foot{gap:8px;flex-wrap:wrap}
.sec-head{flex-wrap:wrap}
.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-btns{display:flex;gap:6px;flex-wrap:wrap}
.ghost.sm{padding:3px 10px;font-size:.8rem;font-weight:500;border-radius:6px}
.del[data-armed="1"]{color:#fff;background:#b8443a}
button:disabled{opacity:.4;cursor:default}
.ghost:disabled:hover,.add .ghost:disabled:hover{background:transparent;color:var(--muted)}
.add button[type=submit]:disabled:hover{background:var(--accent)}
.toggle{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border-radius:6px}
.chev{display:inline-block;color:var(--muted);transition:transform .2s;width:1em;text-align:center}
.toggle:hover .chev{color:var(--fg)}
.toggle[aria-expanded="false"] .chev{transform:rotate(-90deg)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.empty{color:var(--muted);font-style:italic;font-size:.92rem}
.todos li.empty{padding:14px}
td.q{font-family:var(--mono);font-variant-numeric:tabular-nums;width:1%;white-space:nowrap;color:var(--muted)}
td.c{width:64px;white-space:nowrap}
td.c .cell{display:flex;align-items:center;gap:6px}
#packBody tr.dragging td{background:var(--accent-soft)}
#packBody tr.dragging{box-shadow:0 4px 14px rgba(0,0,0,.15);position:relative;z-index:2}
#packBody.is-dragging, #packBody.is-dragging *{cursor:grabbing;user-select:none}
td.x{width:40px;text-align:right}
.note{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.foot{display:flex;justify-content:flex-end}
.reset{background:transparent;color:var(--muted);border:1px solid var(--line)}
.add button[type=submit]{transition:background .15s}
.add button[type=submit]:hover{background:color-mix(in srgb, var(--accent) 82%, var(--fg))}
.reset{transition:background .15s, color .15s}
.ghost{transition:background .15s, color .15s}
.reset:hover{color:var(--fg);background:var(--accent-soft)}
.add .ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.add .ghost:hover{color:var(--fg);background:var(--accent-soft)}
.reset[data-armed="1"]{color:#fff;background:#b8443a;border-color:#b8443a}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* Handy: kompaktere Kopfzeilen, Tabelle ohne Seitwärtsscrollen, Etappen mit voller Feldbreite */
@media (max-width:600px){
  body{padding-block:20px 48px}
  .wrap{gap:28px}
  header{gap:12px}
  .tag{min-width:0;width:100%;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 10px;padding:8px 12px}
  .tag > span:first-child{grid-column:1}
  .tag b{grid-column:2;justify-self:end;font-size:1.05rem}
  .tag .bar,.tag .sync{grid-column:1 / -1}
  .sec-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 10px;margin-bottom:10px}
  .sec-head .title-row{display:contents}
  .sec-head h2{grid-column:1;grid-row:1}
  .sec-head > .count{grid-column:2;grid-row:1;text-align:right}
  .sec-head .sec-btns{grid-column:1 / -1;grid-row:2}
  .info-grid{padding:12px}
  table{min-width:0}
  table col.cc{width:68px}
  table col.cq{width:4.6em}
  table col.cx{width:34px}
  th,td{padding:8px 8px}
  .leg{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px 10px;padding:10px}
  .leg > .leg-no{grid-column:1;grid-row:1}
  .leg-side{display:contents}
  .leg-side .leg-chk{grid-column:3;grid-row:1;margin:0}
  .leg-side .del{grid-column:4;grid-row:1}
  .leg-grid{grid-column:1 / -1;grid-row:2}
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="title">Reiseplaner</h1>
      <p class="sub" data-i18n="subtitle">Reise, Einkauf, To-dos und Koffer an einem Ort</p>
    </div>

  const n = new Date(), today = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())/864e5;

  if (user.can && (await user.can("data.write")) === false) return;
  dbRef = db.collection("data/users/" + uid).doc("packliste");
  let first = true;
  dbRef.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites || dirty || writing) return;
    const d = snap.exists ? snap.data() : null;
    if (d && d.todos && d.cats) {
      synced = JSON.parse(JSON.stringify(d));
      if (JSON.stringify(d) !== JSON.stringify(state)) {
        state = JSON.parse(JSON.stringify(d)); migrate(state);
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
        const a = document.activeElement;
        if (a && a.matches && a.matches(".edit, .fld, .seg")) needsRender = true; else render();
      }
      setSync("syncSaved");
    } else if (first) {
      setSync("");
    }
    first = false;
  }, () => setSync("syncLocal"));
})();
document.addEventListener("focusout", () => { if (needsRender) { needsRender = false; setTimeout(render, 0); } });
</script>
